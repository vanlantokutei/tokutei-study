<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Tokutei Study</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        .card {
            width: min(100%, 440px);
            padding: 30px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(15, 23, 42, .12);
        }
        h1 { margin: 0 0 8px; text-align: center; }
        .subtitle { margin: 0 0 20px; text-align: center; color: #64748b; }
        label { display: block; margin: 15px 0 7px; font-weight: 700; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        .helptext { display: block; margin-top: 5px; color: #64748b; font-size: 13px; }
        ul.errorlist {
            margin: 8px 0;
            padding: 10px 10px 10px 28px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #16a34a;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .back { margin: 20px 0 0; text-align: center; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Tạo tài khoản</h1>
        <p class="subtitle">Đăng ký miễn phí để bắt đầu học</p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">Tên đăng nhập</label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.password1.id_for_label }}">Mật khẩu</label>
            {{ form.password1 }}
            {{ form.password1.errors }}

            <label for="{{ form.password2.id_for_label }}">Nhập lại mật khẩu</label>
            {{ form.password2 }}
            {{ form.password2.errors }}

            <button type="submit">Đăng ký tài khoản</button>
        </form>

        <p class="back">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
        <p class="back"><a href="/">← Về trang chủ</a></p>
    </main>

<style>
.password-eye-wrap{position:relative;display:block}.password-eye-wrap input{padding-right:46px!important;box-sizing:border-box;width:100%}.password-eye-button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px;padding:4px}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('input[type="password"]').forEach(function(i){if(i.dataset.eyeReady)return;i.dataset.eyeReady='1';var w=document.createElement('span');w.className='password-eye-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);var b=document.createElement('button');b.type='button';b.className='password-eye-button';b.textContent='👁';b.setAttribute('aria-label','Hiện mật khẩu');b.onclick=function(){var s=i.type==='text';i.type=s?'password':'text';b.textContent=s?'👁':'🙈';b.setAttribute('aria-label',s?'Hiện mật khẩu':'Ẩn mật khẩu')};w.appendChild(b)})});
</script>

</body>
</html>
