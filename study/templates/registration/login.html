{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Tokutei Study</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        .card {
            width: min(100%, 420px);
            padding: 30px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(15, 23, 42, .12);
        }
        h1 { margin: 0 0 8px; text-align: center; }
        .subtitle { margin: 0 0 24px; text-align: center; color: #64748b; }
        label { display: block; margin: 16px 0 7px; font-weight: 700; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 48px; }
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
        }
        .password-toggle:hover { background: #f1f5f9; }
        .password-toggle svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 14px;
            color: #475569;
            font-size: 14px;
        }
        .remember-row input {
            width: 18px;
            height: 18px;
            margin: 0;
            padding: 0;
            accent-color: #0f9488;
        }
        .remember-row label {
            display: inline;
            margin: 0;
            font-weight: 500;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            padding: 11px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
        }
        .back { margin: 22px 0 0; text-align: center; }
        a { color: #2563eb; text-decoration: none; }
    </style>
  <link rel="stylesheet" href="{% static 'study/seasonal-theme.css' %}">
  <script defer src="{% static 'study/seasonal-theme.js' %}"></script>
</head>
<body>
    <main class="card">
        <h1>Đăng nhập</h1>
        <p class="subtitle">Đăng nhập để tiếp tục học</p>

        {% if form.errors %}
            <p class="error">Tên đăng nhập hoặc mật khẩu không đúng.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

            <label for="{{ form.username.id_for_label }}">Tên đăng nhập</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Mật khẩu</label>
            <div class="password-wrap">
                {{ form.password }}
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                    <svg id="eyeOffIcon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c5.5 0 9.5 4.5 10 6-.5 1.5-1.7 3.2-3.4 4.5"></path>
                        <path d="M6.6 6.6C4.2 8.1 2.5 10.3 2 12c.5 1.5 4.5 6 10 6a10 10 0 0 0 4.1-.9"></path>
                    </svg>
                    <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                    </svg>
                </button>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Nhớ đăng nhập trên thiết bị này</label>
            </div>

            <button class="submit-btn" type="submit">Đăng nhập</button>
        </form>

        <p class="back"><a href="/">← Về trang chủ</a></p>
        <p class="back">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký miễn phí</a></p>
    </main>

    <script>
        (function () {
            const passwordInput = document.getElementById('{{ form.password.id_for_label }}');
            const usernameInput = document.getElementById('{{ form.username.id_for_label }}');
            const toggleButton = document.getElementById('togglePassword');
            const eyeOffIcon = document.getElementById('eyeOffIcon');
            const eyeIcon = document.getElementById('eyeIcon');

            if (usernameInput) usernameInput.setAttribute('autocomplete', 'username');
            if (passwordInput) passwordInput.setAttribute('autocomplete', 'current-password');

            if (!passwordInput || !toggleButton) return;

            toggleButton.addEventListener('click', function () {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                eyeOffIcon.style.display = isHidden ? 'none' : 'block';
                eyeIcon.style.display = isHidden ? 'block' : 'none';
                toggleButton.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                toggleButton.setAttribute('title', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            });
        })();
    </script>
</body>
</html>
