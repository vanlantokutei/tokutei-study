{% load static %}
<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Luyện lại câu sai</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f8fafc;color:#1e293b}.container{max-width:850px;margin:40px auto;padding:20px}.card{background:#fff;padding:30px;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.top{color:#0f766e;font-weight:800;margin-bottom:20px}.question{font-size:23px;font-weight:800;line-height:2;margin:25px 0}.answer{width:100%;text-align:left;padding:16px;margin:12px 0;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:17px;cursor:pointer}.answer:hover{border-color:#0f766e;background:#f0fdfa}.translation{display:none;margin-top:8px;color:#475569}#feedback{display:none;padding:18px;margin-top:20px;border:1px solid #ccfbf1;border-radius:12px;background:#f0fdfa}ruby{ruby-position:over}rt{font-size:.55em;color:#0f766e}@media(max-width:600px){.container{margin:20px auto;padding:14px}.card{padding:20px}.question{font-size:20px}}
</style><link rel="stylesheet" href="{% static 'study/seasonal-theme.css' %}"><script defer src="{% static 'study/seasonal-theme.js' %}"></script></head><body><div class="container"><div class="card"><div class="top">🔁 Luyện lại câu sai {{ index|add:1 }} / {{ total_wrong }}</div><div class="question">{{ question.question_ruby|safe }}</div><form method="post" id="retryForm">{% csrf_token %}<button class="answer" type="button" onclick="checkAnswer('A')">A. {{ question.option_a_ruby|safe }}<div class="translation" id="vi-A">🇻🇳 {{ question.option_a_vi }}</div></button><button class="answer" type="button" onclick="checkAnswer('B')">B. {{ question.option_b_ruby|safe }}<div class="translation" id="vi-B">🇻🇳 {{ question.option_b_vi }}</div></button><button class="answer" type="button" onclick="checkAnswer('C')">C. {{ question.option_c_ruby|safe }}<div class="translation" id="vi-C">🇻🇳 {{ question.option_c_vi }}</div></button><input type="hidden" name="answer" id="answerInput"></form><div id="feedback"><h3 id="feedbackTitle"></h3><p>🇻🇳 {{ question.question_vi }}</p><p>📖 <strong>Giải thích:</strong><br><br>{{ question.explanation|linebreaksbr }}</p></div></div></div><script>const correctAnswer="{{ question.correct_answer|escapejs }}";function checkAnswer(choice){['A','B','C'].forEach(x=>document.getElementById('vi-'+x).style.display='block');const box=document.getElementById('feedback'),title=document.getElementById('feedbackTitle');box.style.display='block';if(choice===correctAnswer){title.innerHTML='✅ Chính xác! Đang chuyển sang câu tiếp theo...';document.getElementById('answerInput').value=choice;setTimeout(()=>document.getElementById('retryForm').submit(),900)}else{title.innerHTML='❌ Chưa đúng. Đáp án đúng là '+correctAnswer}}</script></body></html>
