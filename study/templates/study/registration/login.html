{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Tokutei Study</title>
  <link rel="stylesheet" href="{% static 'study/seasonal-theme.css' %}">
  <script defer src="{% static 'study/seasonal-theme.js' %}"></script>
</head>
<body>
    <h1>Đăng nhập</h1>

    {% if form.errors %}
        <p>Tên đăng nhập hoặc mật khẩu không đúng.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Tên đăng nhập:</label>
            {{ form.username }}
        </p>

        <p>
            <label>Mật khẩu:</label>
            {{ form.password }}
        </p>

        <button type="submit">Đăng nhập</button>
    </form>

    <p><a href="/">← Về trang chủ</a></p>
</body>
</html>
