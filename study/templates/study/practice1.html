<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện thi Tokutei 外食業</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        h1 {
            color: #222;
        }

        .question {
            font-size: 24px;
            font-weight: bold;
            margin: 25px 0;
        }

        button.answer {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px;
            margin: 12px 0;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
        }

        button.answer:hover {
            background: #eef4ff;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f1f1;
            font-size: 17px;
        }

        .next {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🇯🇵 Luyện thi Tokutei 外食業</h1>

    {% if question %}

        <p>
            <strong>Chủ đề:</strong>
            {{ question.category }}
        </p>

        <div class="question">
            {{ question.question_jp }}
        </div>

        <button class="answer"
            onclick="choose('A', '{{ question.option_a_vi|escapejs }}')">
            A. {{ question.option_a }}
        </button>

        <button class="answer"
            onclick="choose('B', '{{ question.option_b_vi|escapejs }}')">
            B. {{ question.option_b }}
        </button>

        <button class="answer"
            onclick="choose('C', '{{ question.option_c_vi|escapejs }}')">
            C. {{ question.option_c }}
        </button>

        <button class="answer"
            onclick="choose('D', '{{ question.option_d_vi|escapejs }}')">
            D. {{ question.option_d }}
        </button>

        <div id="result">

            <h2 id="status"></h2>

            <p>
                🇻🇳 <strong>Nghĩa tiếng Việt:</strong>
                <span id="vietnamese"></span>
            </p>

            <p>
                📖 <strong>Giải thích:</strong><br>
                {{ question.explanation|linebreaksbr }}
            </p>

            {% if next_question %}
                <a class="next"
                   href="/tokutei1/practice/?id={{ next_question.id }}">
                    ➡️ Câu tiếp theo
                </a>
            {% endif %}

        </div>

        <script>
            const correctAnswer = "{{ question.correct_answer|escapejs }}";

            function choose(answer, vietnamese) {

                document.getElementById("result").style.display = "block";

                document.getElementById("vietnamese").innerText =
                    vietnamese || "Chưa nhập bản dịch tiếng Việt.";

                if (answer === correctAnswer) {
                    document.getElementById("status").innerHTML =
                        "✅ Chính xác!";
                } else {
                    document.getElementById("status").innerHTML =
                        "❌ Chưa đúng — đáp án đúng là " + correctAnswer;
                }

                document.getElementById("result").scrollIntoView({
                    behavior: "smooth"
                });
            }
        </script>

    {% else %}

        <h2>Chưa có câu hỏi.</h2>

    {% endif %}

</div>

</body>
</html>
