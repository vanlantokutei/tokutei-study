{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | {% trans "Django site admin" %}{% endblock %}
{% block branding %}<div id="site-name"><a href="{% url 'admin:index' %}">Django administration</a></div>{% endblock %}
{% block nav-global %}{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
  .password-eye-wrap { position: relative; display: inline-block; max-width: 100%; }
  .password-eye-wrap input { padding-right: 44px !important; box-sizing: border-box; }
  .password-eye-button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px; color: inherit; }
</style>
<script>
var eyeOpen="<svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path d='M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z' fill='none' stroke='currentColor' stroke-width='2'/><circle cx='12' cy='12' r='3' fill='none' stroke='currentColor' stroke-width='2'/></svg>";var eyeClosed="<svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path d='M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3 3.7M6.3 6.3C3.5 8.2 2 12 2 12s3.5 6 10 6a10 10 0 0 0 3.2-.5M9.9 9.9A3 3 0 0 0 14.1 14.1' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>";
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('input[type="password"]').forEach(function (input) {
    if (input.dataset.eyeReady) return;
    input.dataset.eyeReady = '1';
    var wrap = document.createElement('span');
    wrap.className = 'password-eye-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'password-eye-button';
    button.innerHTML = eyeOpen;
    button.setAttribute('aria-label', 'Hiện mật khẩu');
    button.addEventListener('click', function () {
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.innerHTML = showing ? eyeOpen : eyeClosed;
      button.setAttribute('aria-label', showing ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
    });
    wrap.appendChild(button);
  });
});
</script>
{% endblock %}
