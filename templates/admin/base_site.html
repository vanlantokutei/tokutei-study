{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | {% trans "Django site admin" %}{% endblock %}
{% block branding %}<div id="site-name"><a href="{% url 'admin:index' %}">Django administration</a></div>{% endblock %}
{% block nav-global %}{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
  .password-eye-wrap { position: relative; display: inline-block; max-width: 100%; }
  .password-eye-wrap input { padding-right: 44px !important; box-sizing: border-box; }
  .password-eye-button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px; color: inherit; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('input[type="password"]').forEach(function (input) {
    if (input.dataset.eyeReady) return;
    input.dataset.eyeReady = '1';
    var wrap = document.createElement('span');
    wrap.className = 'password-eye-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'password-eye-button';
    button.textContent = '👁';
    button.setAttribute('aria-label', 'Hiện mật khẩu');
    button.addEventListener('click', function () {
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? '👁' : '🙈';
      button.setAttribute('aria-label', showing ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
    });
    wrap.appendChild(button);
  });
});
</script>
{% endblock %}
